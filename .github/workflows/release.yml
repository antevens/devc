name: release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Lint and test
        run: make lint test

      - name: Build
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          for platform in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            goos="${platform%/*}"
            goarch="${platform#*/}"
            name="devc_${VERSION}_${goos}_${goarch}"
            mkdir -p "build/${name}"
            CGO_ENABLED=0 GOOS="${goos}" GOARCH="${goarch}" \
              go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
              -o "build/${name}/devc" ./cmd/devc
            cp LICENSE* README.md "build/${name}/" 2>/dev/null || true
            tar -C build -czf "dist/${name}.tar.gz" "${name}"
          done
          (cd dist && sha256sum -- *.tar.gz > checksums.txt)

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "${TAG}" dist/* --title "${TAG}" --generate-notes --verify-tag
